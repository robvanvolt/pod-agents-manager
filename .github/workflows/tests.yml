name: tests

# Lint + sham tests for the pod-agents-manager bash entrypoint and lib modules.
# This workflow does NOT touch GitHub Pages — no deploy-pages action, no
# gh-pages branch writes — so it cannot retrigger Pages builds.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Opt JavaScript-based actions (actions/checkout, etc.) into the Node.js 24
# runtime ahead of GitHub's June 2026 default switch. Removes the
# "Node.js 20 actions are deprecated" warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false  # the server module is stdlib-only; no deps to cache

      - name: Run bash test suite
        run: bash tests/run.sh

      - name: Run Go server tests
        run: go test -count=1 ./...
        working-directory: .pod_agents_config/server
