<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pod Dashboard</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/xterm/xterm.css">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="./logo.svg" alt=""></span>
        <div class="title-stack">
          <h1>Pod Dashboard</h1>
          <span class="tagline">rootless AI agent fleets</span>
        </div>
      </div>
      <div class="chips" id="topbar-chips" aria-live="polite">
        <span class="chip version" id="chip-version" hidden><span class="label">version</span><code id="chip-version-val">–</code></span>
        <span class="chip" id="chip-host" hidden><span class="label">host</span><code id="chip-host-val">–</code></span>
        <span class="chip" id="chip-ip" hidden><span class="label">ip</span><code id="chip-ip-val">–</code></span>
        <span class="chip" id="chip-auth"><span class="label">role</span><code id="chip-auth-val">viewer</code></span>
        <span class="chip" id="chip-time"><span class="label">time</span><code id="chip-time-val">…</code></span>
        <button type="button" id="passkey-manage-button" onclick="openPasskeyDialog()" hidden>Passkeys</button>
        <button type="button" id="passkey-register-button" onclick="registerPasskey()" hidden>Register Passkey</button>
        <button type="button" id="auth-button" onclick="toggleAuth()">Unlock</button>
      </div>
  </div>
  <div id="toast" class="toast"></div>
  <dialog id="auth-dialog" class="auth-dialog">
    <form method="dialog" class="auth-panel" onsubmit="return submitAuthDialog(event)">
      <div class="auth-head">
        <h2>Unlock Operator Mode</h2>
        <button type="button" aria-label="Close" onclick="closeAuthDialog()">×</button>
      </div>
      <label for="auth-token">Operator token</label>
      <div class="auth-input-row">
        <input id="auth-token" name="token" type="password" autocomplete="current-password">
        <button type="button" id="auth-token-toggle" onclick="toggleTokenVisibility()">Show</button>
      </div>
      <p id="auth-error" class="auth-error" aria-live="polite"></p>
      <div class="auth-actions">
        <button type="button" id="auth-passkey-button" onclick="loginWithPasskey()" hidden>Use Passkey</button>
        <button type="button" onclick="closeAuthDialog()">Cancel</button>
        <button type="submit" class="primary">Unlock</button>
      </div>
    </form>
  </dialog>
  <dialog id="passkey-dialog" class="auth-dialog passkey-dialog">
    <div class="auth-panel">
      <div class="auth-head">
        <h2>Operator Passkeys</h2>
        <button type="button" aria-label="Close" onclick="closePasskeyDialog()">×</button>
      </div>
      <div id="passkey-list" class="passkey-list">
        <p class="passkey-empty">Loading passkeys…</p>
      </div>
      <p id="passkey-error" class="auth-error" aria-live="polite"></p>
      <div class="auth-actions">
        <button type="button" onclick="closePasskeyDialog()">Close</button>
      </div>
    </div>
  </dialog>
  <dialog id="terminal-dialog" class="terminal-dialog">
    <div class="terminal-panel">
      <div class="terminal-head">
        <div class="terminal-title-row">
          <h2 id="terminal-title">Terminal</h2>
          <p id="terminal-meta">waiting for capture</p>
        </div>
        <button type="button" aria-label="Close terminal" onclick="closeTerminal()">×</button>
      </div>
      <div id="terminal-output" class="terminal-screen"></div>
      <div id="terminal-empty" class="terminal-empty" hidden>
        <p>No terminal output captured.</p>
        <button type="button" class="primary" onclick="startTerminalSession()">Start agent session</button>
      </div>
    </div>
  </dialog>

  <div class="card table-card">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Activity</th><th>CPU %</th><th>MEM Usage</th><th>MEM %</th>
        <th>NET I/O</th><th>BLOCK I/O</th><th>PIDS</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="stats-body">
      <tr><td colspan="10">Loading stats…</td></tr>
    </tbody>
  </table>
  </div>

  <div class="card">
    <h2>Create new pod</h2>
    <form id="create-form" onsubmit="return submitCreate(event)">
      <div class="grid">
        <div><label>Agent</label><select name="agent" id="f-agent" required></select></div>
        <div><label>Instance <span style="opacity:.6">(blank = auto)</span></label><input name="instance" id="f-instance" placeholder="dev, alpha, …"></div>
        <div><label>Flavor</label><select name="flavor" id="f-flavor"></select></div>
        <div><label>Volumes</label><select name="volumes" id="f-volumes"></select></div>
        <div><label>Base image</label><select name="base" id="f-base"></select></div>
      </div>
      <div class="actions-row">
        <button type="submit" class="primary" id="f-submit">Start pod</button>
        <span id="f-status" style="font-size: 12px; opacity:.8;"></span>
      </div>
      <pre class="out" id="f-out"></pre>
    </form>
  </div>
  </div>

  <script src="./vendor/simplewebauthn/browser.js"></script>
  <script src="./vendor/xterm/xterm.js"></script>
  <script>
    let authState = { role: 'viewer', authenticated: false };
    let passkeyCache = [];
    let terminalState = { agent: '', instance: '', socket: null, connectTimer: null, followTail: true, term: null, rendering: false };

    const fmtBytes = (raw) => {
      const n = Number(raw);
      if (!isFinite(n) || raw === undefined || raw === null) return String(raw ?? '-');
      const u = ['B','kB','MB','GB','TB']; let i = 0; let v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return i === 0 ? `${Math.round(v)}${u[i]}` : `${v.toFixed(v >= 100 ? 1 : 2)}${u[i]}`;
    };
    const parsePct = (raw) => {
      if (raw == null || raw === '-' || raw === '') return null;
      const n = parseFloat(String(raw).replace('%', ''));
      return isFinite(n) ? n : null;
    };
    const fmtPct = (raw) => {
      const n = parsePct(raw);
      return n == null ? '-' : `${n.toFixed(2)}%`;
    };
    const heatColor = (pct) => {
      const p = Math.max(0, Math.min(pct, 100));
      let r, g, b;
      if (p <= 25) { const t = p / 25; r = 34 + (234 - 34) * t; g = 197 + (179 - 197) * t; b = 94 + (8 - 94) * t; }
      else { const t = (p - 25) / 75; r = 234 + (220 - 234) * t; g = 179 + (38 - 179) * t; b = 8 + (38 - 8) * t; }
      return `rgba(${r|0},${g|0},${b|0},0.22)`;
    };
    const heatCell = (pct, label) => {
      if (pct == null) return `<span>${label}</span>`;
      return `<div class="heat-wrap"><div class="heat-fill" style="width:${Math.max(0,Math.min(pct,100)).toFixed(2)}%; background:${heatColor(pct)};"></div><span class="heat-text">${label}</span></div>`;
    };
    const memUsage = (c) => {
      if (c.MemUsageBytes != null) return `${fmtBytes(c.MemUsageBytes)} / ${fmtBytes(c.MemLimit)}`;
      const raw = c.MemUsage;
      if (!raw) return '-';
      if (/^\d+$/.test(String(raw).trim())) return fmtBytes(raw);
      return String(raw);
    };
    const ioPair = (c, ins, outs, fallback) => {
      const i = ins.find(k => c[k] != null);
      const o = outs.find(k => c[k] != null);
      if (i || o) return `${i ? fmtBytes(c[i]) : '-'} / ${o ? fmtBytes(c[o]) : '-'}`;
      return c[fallback] || '-';
    };
    const activityBadge = (state, detail) => {
      const safeState = String(state || 'unknown').toLowerCase();
      const label = safeState === 'running' ? 'running' : safeState === 'idle' ? 'idle' : safeState;
      const title = String(detail || '').replace(/"/g, '&quot;');
      return `<span class="activity-badge ${safeState}" title="${title}"><span></span>${label}</span>`;
    };
    const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[ch]));
    const shortID = (value) => {
      const text = String(value || '');
      return text.length > 14 ? `${text.slice(0, 8)}…${text.slice(-6)}` : text;
    };
    const binocularIcon = () => `
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
        <path d="M8.6 4.2 6.4 5.3 4.5 12.1"></path>
        <path d="M15.4 4.2l2.2 1.1 1.9 6.8"></path>
        <path d="M9 5h6"></path>
        <path d="M10 8h4"></path>
        <circle cx="7" cy="16" r="4"></circle>
        <circle cx="17" cy="16" r="4"></circle>
        <path d="M11 16h2"></path>
      </svg>`;
    function setChip(id, value) {
      const chip = document.getElementById(id);
      const val = document.getElementById(`${id}-val`);
      if (!chip || !val) return;
      if (value == null || value === '') { chip.hidden = true; return; }
      val.textContent = value;
      chip.hidden = false;
    }

    async function fetchInfo() {
      try {
        const res = await fetch('/api/info');
        const data = await res.json();
        setChip('chip-version', data.version || null);
        setChip('chip-host', data.hostname || null);
        setChip('chip-ip', (data.ips || [])[0] || null);
      } catch (_) {}
    }

    async function fetchAuthStatus() {
      try {
        const res = await fetch('/api/auth/status');
        authState = await res.json();
      } catch (_) {
        authState = { role: 'viewer', authenticated: false };
      }
      renderAuthState();
    }

    function renderAuthState() {
      setChip('chip-auth', authState.role || 'viewer');
      const btn = document.getElementById('auth-button');
      if (btn) btn.textContent = authState.authenticated ? 'Lock' : 'Unlock';
      const canWrite = authState.role === 'operator';
      const passkeyReady = passkeysUsable();
      const passkeyCount = Number(authState.passkeys?.registered || 0);
      const registerBtn = document.getElementById('passkey-register-button');
      if (registerBtn) {
        registerBtn.hidden = !canWrite || !passkeyReady;
        registerBtn.title = passkeyReady ? 'Register this browser or device as an operator passkey' : 'Passkeys require HTTPS, localhost, and WebAuthn support';
      }
      const manageBtn = document.getElementById('passkey-manage-button');
      if (manageBtn) {
        manageBtn.hidden = !canWrite;
        manageBtn.textContent = passkeyCount > 0 ? `Passkeys (${passkeyCount})` : 'Passkeys';
        manageBtn.title = canWrite ? 'Manage registered operator passkeys' : 'Unlock operator mode to manage passkeys';
      }
      const passkeyLoginBtn = document.getElementById('auth-passkey-button');
      if (passkeyLoginBtn) {
        passkeyLoginBtn.hidden = authState.authenticated || passkeyCount < 1 || !passkeyReady;
        passkeyLoginBtn.title = passkeyReady ? 'Unlock operator mode with a registered passkey' : 'Passkeys require HTTPS, localhost, and WebAuthn support';
      }
      const submit = document.getElementById('f-submit');
      if (submit) {
        submit.disabled = !canWrite;
        submit.title = canWrite ? '' : 'Unlock operator mode to create pods';
      }
      document.querySelectorAll('[data-write-action], [data-operator-action]').forEach(el => {
        el.disabled = !canWrite || el.dataset.disabledReason === 'idle';
      });
    }

    async function toggleAuth() {
      if (authState.authenticated) {
        await fetch('/api/auth/logout', { method: 'POST' });
        showToast('Dashboard locked');
        await fetchAuthStatus();
        fetchStats();
        return;
      }
      openAuthDialog();
    }

    function openAuthDialog() {
      const dialog = document.getElementById('auth-dialog');
      const input = document.getElementById('auth-token');
      const err = document.getElementById('auth-error');
      if (!dialog || !input) return;
      if (err) err.textContent = '';
      input.value = '';
      dialog.showModal();
      input.focus();
    }

    function closeAuthDialog() {
      const dialog = document.getElementById('auth-dialog');
      if (dialog?.open) dialog.close();
    }

    function toggleTokenVisibility() {
      const input = document.getElementById('auth-token');
      const btn = document.getElementById('auth-token-toggle');
      if (!input || !btn) return;
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
    }

    async function submitAuthDialog(ev) {
      ev.preventDefault();
      const input = document.getElementById('auth-token');
      const err = document.getElementById('auth-error');
      const token = input?.value?.trim();
      if (!token) return;
      const body = new URLSearchParams();
      body.append('token', token);
      const res = await fetch('/api/auth/login', { method: 'POST', body });
      if (!res.ok) {
        if (err) err.textContent = res.status === 429 ? 'Too many attempts. Try again shortly.' : 'Token rejected.';
        return false;
      }
      closeAuthDialog();
      showToast('Operator mode unlocked');
      await fetchAuthStatus();
      fetchStats();
      return false;
    }

    function passkeysUsable() {
      const api = window.SimpleWebAuthnBrowser;
      return Boolean(window.isSecureContext && api?.browserSupportsWebAuthn?.());
    }

    async function passkeyRequest(path, body = null) {
      const res = await fetch(path, {
        method: 'POST',
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await res.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch (_) { data = { error: text }; }
      }
      if (!res.ok) throw new Error(data.error || text || res.statusText);
      return data;
    }

    async function registerPasskey() {
      const err = document.getElementById('auth-error');
      try {
        if (!passkeysUsable()) throw new Error('Passkeys require HTTPS or localhost in a WebAuthn-capable browser.');
        const optionsJSON = await passkeyRequest('/api/auth/passkey/register/options');
        const credential = await window.SimpleWebAuthnBrowser.startRegistration({ optionsJSON });
        await passkeyRequest('/api/auth/passkey/register/verify', credential);
        showToast('Passkey registered');
        if (err) err.textContent = '';
        await fetchAuthStatus();
      } catch (error) {
        const msg = error?.message || 'Passkey registration failed';
        if (err) err.textContent = msg;
        showToast(msg, true);
      }
    }

    async function loginWithPasskey() {
      const err = document.getElementById('auth-error');
      try {
        if (!passkeysUsable()) throw new Error('Passkeys require HTTPS or localhost in a WebAuthn-capable browser.');
        if (err) err.textContent = '';
        const optionsJSON = await passkeyRequest('/api/auth/passkey/login/options');
        const credential = await window.SimpleWebAuthnBrowser.startAuthentication({ optionsJSON });
        await passkeyRequest('/api/auth/passkey/login/verify', credential);
        closeAuthDialog();
        showToast('Operator mode unlocked with passkey');
        await fetchAuthStatus();
        fetchStats();
      } catch (error) {
        if (err) err.textContent = error?.message || 'Passkey rejected.';
      }
    }

    async function openPasskeyDialog() {
      const dialog = document.getElementById('passkey-dialog');
      if (!dialog) return;
      dialog.showModal();
      await loadPasskeys();
    }

    function closePasskeyDialog() {
      const dialog = document.getElementById('passkey-dialog');
      if (dialog?.open) dialog.close();
    }

    async function loadPasskeys() {
      const list = document.getElementById('passkey-list');
      const err = document.getElementById('passkey-error');
      if (!list) return;
      if (err) err.textContent = '';
      list.innerHTML = '<p class="passkey-empty">Loading passkeys…</p>';
      try {
        const res = await fetch('/api/auth/passkeys');
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch (_) { data = { error: text }; }
        if (!res.ok) throw new Error(data.error || text || res.statusText);
        const keys = data.passkeys || [];
        passkeyCache = keys;
        if (keys.length === 0) {
          list.innerHTML = '<p class="passkey-empty">No passkeys registered yet.</p>';
          return;
        }
        list.innerHTML = keys.map(key => {
          const label = key.label || 'Unnamed passkey';
          const created = key.created_at ? new Date(key.created_at).toLocaleString() : 'unknown';
          const used = key.last_used_at ? new Date(key.last_used_at).toLocaleString() : 'never';
          return `
            <div class="passkey-row">
              <div class="passkey-main">
                <strong>${escapeHTML(label)}</strong>
                <span><code>${escapeHTML(shortID(key.id))}</code> · created ${escapeHTML(created)} · last used ${escapeHTML(used)}</span>
              </div>
              <div class="passkey-actions">
                <button type="button" onclick="renamePasskey('${escapeHTML(key.id)}')">Rename</button>
                <button type="button" class="danger" onclick="deletePasskey('${escapeHTML(key.id)}')">Delete</button>
              </div>
            </div>`;
        }).join('');
      } catch (error) {
        const msg = error?.message || 'Failed to load passkeys';
        list.innerHTML = '<p class="passkey-empty">Could not load passkeys.</p>';
        if (err) err.textContent = msg;
      }
    }

    async function managePasskey(path, body, successMessage) {
      const err = document.getElementById('passkey-error');
      try {
        await passkeyRequest(path, body);
        showToast(successMessage);
        await fetchAuthStatus();
        await loadPasskeys();
      } catch (error) {
        const msg = error?.message || 'Passkey update failed';
        if (err) err.textContent = msg;
        showToast(msg, true);
      }
    }

    async function renamePasskey(id) {
      const current = passkeyCache.find(key => key.id === id);
      const currentLabel = current?.label || '';
      const label = prompt('Passkey label', currentLabel || '');
      if (label == null) return;
      await managePasskey('/api/auth/passkeys/rename', { id, label: label.trim() }, 'Passkey renamed');
    }

    async function deletePasskey(id) {
      const current = passkeyCache.find(key => key.id === id);
      const label = current?.label || shortID(id);
      if (!confirm(`Delete passkey "${label || shortID(id)}"?`)) return;
      await managePasskey('/api/auth/passkeys/delete', { id }, 'Passkey deleted');
    }

    function updateClock() {
      const val = document.getElementById('chip-time-val');
      if (val) val.textContent = new Date().toLocaleTimeString();
    }

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        console.error('stats fetch failed:', err);
      }
    }

    function renderTable(containers) {
      const tbody = document.getElementById('stats-body');
      if (!containers || containers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10">No containers running</td></tr>';
        return;
      }
      const html = containers.map(c => {
        const name = c.Name || '-';
        const dash = name.indexOf('-');
        const agent = c.PodAgent || (dash > 0 ? name.slice(0, dash) : '');
        const instance = c.PodInstance || (dash > 0 ? name.slice(dash + 1) : '');
        const cpu = parsePct(c.CPU || c.CPUPerc);
        const mem = parsePct(c.MemPerc);
        const id = (c.ID || c.ContainerID || '').slice(0, 12);
        const canInstruct = String(c.ActivityState || '').toLowerCase() === 'idle';
        const canWrite = authState.role === 'operator';
        const actions = (agent && instance) ? `
          <div class="inline">
            <button data-operator-action class="icon-btn" ${canWrite ? '' : 'disabled'} title="View terminal" aria-label="View terminal for ${agent}-${instance}" onclick="openTerminal('${agent}','${instance}')">${binocularIcon()}</button>
            <button data-write-action ${canWrite ? '' : 'disabled'} onclick="sendAction('restart','${agent}','${instance}')">restart</button>
            <button data-write-action ${canWrite ? '' : 'disabled'} onclick="sendAction('stop','${agent}','${instance}')">stop</button>
            <button data-write-action ${canWrite ? '' : 'disabled'} onclick="sendAction('start','${agent}','${instance}')">start</button>
            <button data-write-action data-disabled-reason="${canInstruct ? '' : 'idle'}" ${canWrite && canInstruct ? '' : 'disabled'} title="${canInstruct ? '' : 'pod is not idle'}" onclick="sendInstruction('${agent}','${instance}')">instruct</button>
            <button data-write-action ${canWrite ? '' : 'disabled'} class="danger" onclick="confirmDelete('${agent}','${instance}')">delete</button>
          </div>` : '';
        return `<tr>
          <td data-label="ID"><code>${id}</code></td>
          <td data-label="Name"><b>${name}</b></td>
          <td data-label="Activity">${activityBadge(c.ActivityState, c.ActivityDetail)}</td>
          <td data-label="CPU %">${heatCell(cpu, fmtPct(c.CPU || c.CPUPerc))}</td>
          <td data-label="MEM Usage">${memUsage(c)}</td>
          <td data-label="MEM %">${heatCell(mem, fmtPct(c.MemPerc))}</td>
          <td data-label="NET I/O">${ioPair(c, ['NetInput','NetworkInput'], ['NetOutput','NetworkOutput'], 'NetIO')}</td>
          <td data-label="BLOCK I/O">${ioPair(c, ['BlockInput'], ['BlockOutput'], 'BlockIO')}</td>
          <td data-label="PIDS">${c.PIDS || c.Pids || c.PIDs || '-'}</td>
          <td data-label="Actions">${actions}</td>
        </tr>`;
      }).join('');
      tbody.innerHTML = html;
    }

    function confirmDelete(agent, instance) {
      if (confirm(`Delete ${agent}-${instance}? This wipes its workspace.`)) sendAction('delete', agent, instance);
    }

    function openTerminal(agent, instance) {
      const dialog = document.getElementById('terminal-dialog');
      if (!dialog) return;
      closeTerminalSocket();
      terminalState.agent = agent;
      terminalState.instance = instance;
      document.getElementById('terminal-title').textContent = `${agent}-${instance}`;
      document.getElementById('terminal-meta').textContent = 'connecting terminal…';
      document.getElementById('terminal-empty').hidden = true;
      terminalState.followTail = true;
      dialog.showModal();
      initTerminal();
      fitTerminal();
      renderTerminalOutput('Loading terminal…');
      requestAnimationFrame(() => {
        fitTerminal();
        connectTerminalSocket();
        terminalState.term?.focus();
      });
    }

    function closeTerminal() {
      closeTerminalSocket();
      const dialog = document.getElementById('terminal-dialog');
      if (dialog?.open) dialog.close();
    }

    async function connectTerminalSocket() {
      if (!terminalState.agent || !terminalState.instance) return;
      closeTerminalSocket();
      const meta = document.getElementById('terminal-meta');
      await fetchAuthStatus();
      if (authState.role !== 'operator') {
        renderTerminalOutput('Unlock operator mode first.\r\n\r\nThe terminal WebSocket requires an active operator session.', true);
        meta.textContent = 'terminal locked';
        return;
      }
      meta.textContent = 'connecting terminal…';
      const size = fitTerminal();
      const params = new URLSearchParams({ agent: terminalState.agent, instance: terminalState.instance });
      if (size) {
        params.set('cols', String(size.cols));
        params.set('rows', String(size.rows));
      }
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${proto}//${window.location.host}/api/terminal/ws?${params.toString()}`);
      terminalState.socket = socket;
      socket._gotMessage = false;
      terminalState.connectTimer = setTimeout(() => {
        if (terminalState.socket !== socket || socket._gotMessage) return;
        renderTerminalOutput('Terminal is still connecting…', true);
        meta.textContent = 'waiting for terminal stream';
      }, 2500);

      socket.addEventListener('open', () => {
        meta.textContent = 'terminal connected';
        sendTerminalResize();
      });
      socket.addEventListener('message', (ev) => {
        socket._gotMessage = true;
        clearTerminalConnectTimer();
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }
        if (msg.type === 'snapshot' && msg.snapshot) {
          handleTerminalSnapshot(msg.snapshot);
        } else if (msg.type === 'output') {
          writeTerminalChunk(msg.data || '');
        } else if (msg.type === 'status') {
          meta.textContent = msg.data || 'terminal status';
        } else if (msg.type === 'error') {
          showToast(msg.error || 'terminal error', true);
          meta.textContent = 'terminal error';
        }
      });
      socket.addEventListener('close', (ev) => {
        clearTerminalConnectTimer();
        if (terminalState.socket === socket) {
          terminalState.socket = null;
          meta.textContent = 'terminal disconnected';
          if (!socket._gotMessage) {
            const reason = authState.role !== 'operator'
              ? 'Unlock operator mode first.'
              : `Terminal connection closed before output.${ev.code ? '\r\nCode: ' + ev.code + '.' : ''}`;
            renderTerminalOutput(reason, true);
          } else {
            // Session ended cleanly after we'd received output (Ctrl+D in
            // the fallback shell, `exit`, tmux session ending, etc.).
            // Auto-dismiss the dialog so it feels like a real terminal
            // emulator. Brief delay lets the user see the "disconnected"
            // status; the dialog also closes on Escape if they prefer.
            const dialog = document.getElementById('terminal-dialog');
            if (dialog?.open) {
              setTimeout(() => {
                if (terminalState.socket === null && dialog.open) {
                  try { dialog.close(); } catch (_) {}
                }
              }, 600);
            }
          }
        }
      });
      socket.addEventListener('error', () => {
        clearTerminalConnectTimer();
        if (!socket._gotMessage) renderTerminalOutput('Terminal connection failed.', true);
        meta.textContent = 'terminal failed';
      });
    }

    async function startTerminalSession() {
      await fetchAuthStatus();
      if (authState.role !== 'operator') {
        renderTerminalOutput('Unlock operator mode first.\r\n\r\nStarting a terminal session requires operator mode.', true);
        document.getElementById('terminal-meta').textContent = 'terminal locked';
        return;
      }
      const body = new URLSearchParams({ agent: terminalState.agent, instance: terminalState.instance });
      const res = await fetch('/api/terminal/start', { method: 'POST', body });
      if (!res.ok) {
        showToast(await res.text(), true);
        return;
      }
      document.getElementById('terminal-empty').hidden = true;
      terminalState.followTail = true;
      connectTerminalSocket();
    }

    function isTerminalNearBottom(el) {
      const term = terminalState.term;
      if (!term) return true;
      const buffer = term.buffer.active;
      return buffer.baseY - buffer.viewportY < 3;
    }

    function initTerminal() {
      if (terminalState.term) return;
      const TerminalCtor = window.Terminal;
      if (!TerminalCtor) {
        showToast('xterm failed to load', true);
        return;
      }
      const term = new TerminalCtor({
        cursorBlink: true,
        convertEol: true,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        fontSize: 12,
        lineHeight: 1.15,
        scrollback: 5000,
        theme: { background: '#000000', foreground: '#e5e7eb', cursor: '#f8fafc' }
      });
      terminalState.term = term;
      term.open(document.getElementById('terminal-output'));
      term.onScroll(() => {
        if (!terminalState.rendering) terminalState.followTail = isTerminalNearBottom();
      });
      term.onData((data) => {
        const socket = terminalState.socket;
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({ type: 'input', data }));
      });
      window.addEventListener('resize', fitTerminal);
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => {
          requestAnimationFrame(fitTerminal);
        });
        observer.observe(document.getElementById('terminal-output'));
      }
    }

    function fitTerminal() {
      const term = terminalState.term;
      const el = document.getElementById('terminal-output');
      if (!term || !el || !el.clientWidth || !el.clientHeight) return null;
      const probe = document.createElement('span');
      probe.textContent = 'W';
      probe.style.cssText = 'position:absolute;visibility:hidden;font:12px/1.15 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;';
      document.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();
      const cols = Math.max(40, Math.floor(el.clientWidth / Math.max(rect.width, 7)));
      const rows = Math.max(8, Math.floor(el.clientHeight / Math.max(rect.height, 14)));
      if (term.cols !== cols || term.rows !== rows) {
        term.resize(cols, rows);
        sendTerminalResize();
        requestAnimationFrame(() => term.scrollToBottom());
      }
      return { cols, rows };
    }

    function renderTerminalOutput(raw, follow = terminalState.followTail, previousViewport = 0) {
      initTerminal();
      fitTerminal();
      const term = terminalState.term;
      if (!term) return;
      terminalState.rendering = true;
      term.reset();
      term.write(raw || '', () => {
        if (follow) {
          term.scrollToBottom();
          terminalState.followTail = true;
        } else {
          term.scrollToLine(Math.min(previousViewport, term.buffer.active.baseY));
        }
        terminalState.rendering = false;
      });
    }

    function handleTerminalSnapshot(data) {
      const meta = document.getElementById('terminal-meta');
      const empty = document.getElementById('terminal-empty');
      const size = data.rows && data.cols ? ` · ${data.cols}×${data.rows}` : '';
      meta.textContent = `${data.command || 'no-session'} · ${new Date(data.captured_at).toLocaleTimeString()}${size}`;
      const noSession = data.status === 'no-session';
      if (empty) empty.hidden = !noSession;
      renderTerminalOutput(data.output || '', true);
    }

    function writeTerminalChunk(raw) {
      initTerminal();
      fitTerminal();
      const term = terminalState.term;
      if (!term) return;
      const follow = terminalState.followTail || isTerminalNearBottom();
      term.write(raw || '', () => {
        if (follow) term.scrollToBottom();
      });
    }

    function sendTerminalResize() {
      const socket = terminalState.socket;
      const term = terminalState.term;
      if (!socket || socket.readyState !== WebSocket.OPEN || !term) return;
      socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }

    function closeTerminalSocket() {
      clearTerminalConnectTimer();
      if (!terminalState.socket) return;
      const socket = terminalState.socket;
      terminalState.socket = null;
      try { socket.close(); } catch (_) {}
    }

    function clearTerminalConnectTimer() {
      clearTimeout(terminalState.connectTimer);
      terminalState.connectTimer = null;
    }

    async function sendAction(op, agent, instance) {
      const formData = new URLSearchParams();
      formData.append('op', op);
      formData.append('agent', agent);
      formData.append('instance', instance);
      try {
        const res = await fetch('/api/action', { method: 'POST', body: formData });
        const text = await res.text();
        showToast(res.ok ? `${op} ${agent} ${instance}` : (res.status === 401 ? 'Unlock operator mode first' : text), !res.ok);
        fetchStats();
      } catch (err) {
        showToast('Network error: ' + err, true);
      }
    }

    async function sendInstruction(agent, instance) {
      const message = prompt(`Instruction for ${agent}-${instance}`);
      if (!message || !message.trim()) return;
      const formData = new URLSearchParams();
      formData.append('agent', agent);
      formData.append('instance', instance);
      formData.append('message', message.trim());
      try {
        const res = await fetch('/api/instruct', { method: 'POST', body: formData });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch (_) { data = { error: text }; }
        showToast(res.ok ? `Queued instruction ${data.entry?.id || ''}` : (res.status === 401 ? 'Unlock operator mode first' : (data.error || text)), !res.ok);
      } catch (err) {
        showToast('Network error: ' + err, true);
      }
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (isError ? 'err' : 'ok');
      t.style.display = 'block';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.style.display = 'none', 4000);
    }

    function fillSelect(id, values, selected) {
      const el = document.getElementById(id);
      el.innerHTML = '';
      for (const v of values) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        if (v === selected) opt.selected = true;
        el.appendChild(opt);
      }
    }

    async function loadAgentOptions() {
      try {
        const res = await fetch('/api/agents');
        const data = await res.json();
        fillSelect('f-agent', data.agents || []);
        fillSelect('f-flavor', data.flavors || ['all'], 'all');
        fillSelect('f-volumes', data.volumes || ['all', 'none'], 'all');
        fillSelect('f-base', data.bases || ['alpine', 'trixie-slim'], data.defaultBase || 'alpine');
      } catch (err) {
        console.error('failed to load agent options:', err);
      }
    }

    async function submitCreate(ev) {
      ev.preventDefault();
      const form = document.getElementById('create-form');
      const submit = document.getElementById('f-submit');
      const statusEl = document.getElementById('f-status');
      const outEl = document.getElementById('f-out');
      const fd = new FormData(form);
      const body = new URLSearchParams();
      for (const [k, v] of fd.entries()) body.append(k, v);

      submit.disabled = true;
      statusEl.textContent = 'starting…';
      outEl.style.display = 'none';
      outEl.textContent = '';

      try {
        const res = await fetch('/api/create', { method: 'POST', body });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch (_) { data = { output: text }; }
        if (res.ok) {
          const label = data.instance ? `${data.agent}-${data.instance}` : `${data.agent}-(auto)`;
          statusEl.textContent = `started ${label}`;
          showToast(`Started ${label}`);
          if (data.output) { outEl.textContent = data.output; outEl.style.display = 'block'; }
          form.elements['instance'].value = '';
          fetchStats();
        } else {
          statusEl.textContent = 'failed';
          outEl.textContent = res.status === 401 ? 'Unlock operator mode first.' : (data.output || data.error || text);
          outEl.style.display = 'block';
          showToast('Create failed — see output below', true);
        }
      } catch (err) {
        statusEl.textContent = 'network error';
        showToast('Network error: ' + err, true);
      } finally {
        submit.disabled = false;
      }
      return false;
    }

    fetchInfo();
    fetchAuthStatus();
    fetchStats();
    loadAgentOptions();
    document.getElementById('terminal-dialog')?.addEventListener('close', () => {
      closeTerminalSocket();
    });
    document.getElementById('terminal-output')?.addEventListener('scroll', ev => {
      terminalState.followTail = isTerminalNearBottom(ev.currentTarget);
    });
    setInterval(fetchStats, 3000);
    setInterval(fetchInfo, 30000);
    setInterval(fetchAuthStatus, 30000);
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
